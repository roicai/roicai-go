name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.23", oldstable, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test ./...
        env:
          ROICAI_API_KEY: ${{ secrets.ROICAI_API_KEY }}

  generated:
    name: generated code matches openapi.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/generate.sh --committed
      - name: Fail if generated code was edited by hand or not regenerated
        run: |
          git status --short
          test -z "$(git status --porcelain)"
